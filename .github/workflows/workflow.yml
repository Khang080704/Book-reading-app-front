name: workflow.yml

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Phase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

  push-image:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: | 
          docker build \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:latest \
          .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:latest