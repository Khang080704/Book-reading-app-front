name: workflow.yml

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Phase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

  push-image:
    name: Build Docker Image
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: | 
          docker build \
          --build-arg NEXT_PUBLIC_AUTH_KEYCLOAK_ID=${{ vars.NEXT_PUBLIC_AUTH_KEYCLOAK_ID }} \
          --build-arg NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER=${{ vars.NEXT_PUBLIC_AUTH_KEYCLOAK_ISSUER }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:${{ github.sha }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:latest \
          .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/book-verse-fe:latest

  deploy:
    name: SSH and pull image
    needs: push-image
    runs-on: ubuntu-latest
    steps:
      - name: SSH to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/bookverse/

            docker compose pull

            docker compose up --build -d

            docker image prune -f