name: workflow.yml
on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Build Phase
    runs-on: ubuntu-latest
    steps:
      - name: Load source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Check build output
        run: |
          echo "=== .next ==="
          ls -lah .next
          echo "=== .next/standalone ==="
          ls -lah .next/standalone
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next
          retention-days: 1

  test:
    name: Test Phase
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: nextjs-build
          path: .next

      - name: Run Tests
        run: npm test
